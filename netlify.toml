[build]
  command = "echo 'Build complete'"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The scheduled daily generator (generate-daily-puzzle) was removed Oct 2026:
# the static corpus serves every date, and the job was paying for a gpt-4o
# call each day and then failing to save it. get-daily-puzzle still generates
# live as a fallback if the corpus ever runs out. Restore from git history if
# a scheduled generator is ever needed again.
